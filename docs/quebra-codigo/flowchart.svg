<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="780" viewBox="0 0 560 780">
  <defs>
    <style>
      .title     { font: 700 18px system-ui, sans-serif; fill: #58a6ff; }
      .subtitle  { font: 400 11px system-ui, sans-serif; fill: #6e7681; }
      .step-name { font: 700 13px system-ui, sans-serif; fill: #ffffff; }
      .step-sub  { font: 400 10px system-ui, sans-serif; fill: #8b949e; }
      .arrow-lbl { font: 600 11px system-ui, sans-serif; }
      .oval-text { font: 700 12px system-ui, sans-serif; fill: #e6edf3; letter-spacing: 1px; }
    </style>
    <!-- Arrow marker -->
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#484f58"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3fb950"/>
    </marker>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f0883e"/>
    </marker>
  </defs>

  <!-- ── Background ── -->
  <rect width="560" height="780" fill="#0d1117"/>
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.7" fill="#161b22"/>
  </pattern>
  <rect width="560" height="780" fill="url(#dots)"/>

  <!-- Vertical center guide line (decorative) -->
  <line x1="280" y1="100" x2="280" y2="730" stroke="#21262d" stroke-width="1" stroke-dasharray="2,8"/>

  <!-- ── Title ── -->
  <text x="280" y="32" text-anchor="middle" class="title">Fluxo de uma Sessão de Jogo</text>
  <text x="280" y="50" text-anchor="middle" class="subtitle">QuebraCódigo — padrão comum aos seis jogos de lógica</text>

  <!-- STEP 0 — START -->
  <ellipse cx="280" cy="88" rx="56" ry="24" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="280" y="93" text-anchor="middle" class="oval-text">INÍCIO</text>
  <line x1="280" y1="112" x2="280" y2="130" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 1 — INICIAR PARTIDA -->
  <rect x="150" y="130" width="260" height="58" rx="8" fill="#0a1929" stroke="#388bfd" stroke-width="2"/>
  <rect x="150" y="130" width="5" height="58" rx="3" fill="#388bfd"/>
  <text x="172" y="156" text-anchor="middle" font-family="monospace" font-size="11" fill="#388bfd" font-weight="700">01</text>
  <line x1="183" y1="138" x2="183" y2="180" stroke="#1f3a5c" stroke-width="1"/>
  <text x="270" y="154" text-anchor="middle" class="step-name">Cliente inicia a partida</text>
  <text x="270" y="172" text-anchor="middle" class="step-sub">POST /api/games/{jogo}/start</text>
  <line x1="280" y1="188" x2="280" y2="208" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 2 — CRIA ESTADO -->
  <rect x="150" y="208" width="260" height="58" rx="8" fill="#0d2118" stroke="#3fb950" stroke-width="2"/>
  <rect x="150" y="208" width="5" height="58" rx="3" fill="#3fb950"/>
  <text x="172" y="234" text-anchor="middle" font-family="monospace" font-size="11" fill="#3fb950" font-weight="700">02</text>
  <line x1="183" y1="216" x2="183" y2="258" stroke="#1a3d28" stroke-width="1"/>
  <text x="270" y="232" text-anchor="middle" class="step-name">Servidor cria o estado</text>
  <text x="270" y="250" text-anchor="middle" class="step-sub">ConcurrentHashMap em memória, chave gameId (UUID)</text>
  <line x1="280" y1="266" x2="280" y2="286" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 3 — CLIENTE ENVIA JOGADA -->
  <rect x="150" y="286" width="260" height="58" rx="8" fill="#130d26" stroke="#a371f7" stroke-width="2"/>
  <rect x="150" y="286" width="5" height="58" rx="3" fill="#a371f7"/>
  <text x="172" y="312" text-anchor="middle" font-family="monospace" font-size="11" fill="#a371f7" font-weight="700">03</text>
  <line x1="183" y1="294" x2="183" y2="336" stroke="#2d1f5c" stroke-width="1"/>
  <text x="270" y="310" text-anchor="middle" class="step-name">Cliente envia a jogada</text>
  <text x="270" y="328" text-anchor="middle" class="step-sub">POST /{gameId}/{ação} — apenas a intenção, não o resultado</text>
  <line x1="280" y1="344" x2="280" y2="364" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 4 — DECISÃO -->
  <polygon points="280,364 390,404 280,444 170,404" fill="#1a1000" stroke="#f0883e" stroke-width="2"/>
  <line x1="280" y1="368" x2="386" y2="404" stroke="#f0883e" stroke-width="0.3" opacity="0.3"/>
  <text x="280" y="399" text-anchor="middle" class="step-name" font-size="12">Jogada válida?</text>
  <text x="280" y="415" text-anchor="middle" class="step-sub" font-size="9">Regra de negócio do jogo</text>

  <!-- arrow Sim (down) -->
  <line x1="280" y1="444" x2="280" y2="466" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="286" y="449" width="32" height="14" rx="3" fill="#0d2118"/>
  <text x="302" y="460" text-anchor="middle" class="arrow-lbl" fill="#3fb950">Sim</text>

  <!-- arrow Não (loop back to step 3) -->
  <polyline points="170,404 90,404 90,315 150,315"
            fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3"
            marker-end="url(#arr-red)"/>
  <rect x="72" y="379" width="34" height="14" rx="3" fill="#1a0800"/>
  <text x="89" y="390" text-anchor="middle" class="arrow-lbl" fill="#f0883e">Não</text>
  <text x="80" y="340" text-anchor="middle" font-family="system-ui" font-size="9" fill="#6e7681">400 / 409</text>

  <!-- STEP 5 — ATUALIZA ESTADO -->
  <rect x="150" y="466" width="260" height="58" rx="8" fill="#0d1f2e" stroke="#39c5cf" stroke-width="2"/>
  <rect x="150" y="466" width="5" height="58" rx="3" fill="#39c5cf"/>
  <text x="172" y="492" text-anchor="middle" font-family="monospace" font-size="11" fill="#39c5cf" font-weight="700">05</text>
  <line x1="183" y1="474" x2="183" y2="516" stroke="#0d2e3a" stroke-width="1"/>
  <text x="270" y="490" text-anchor="middle" class="step-name">Servidor atualiza o estado</text>
  <text x="270" y="508" text-anchor="middle" class="step-sub">Dados sensíveis (minas, solução) nunca são serializados</text>
  <line x1="280" y1="524" x2="280" y2="544" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 6 — RESPOSTA -->
  <rect x="150" y="544" width="260" height="58" rx="8" fill="#131820" stroke="#79c0ff" stroke-width="2"/>
  <rect x="150" y="544" width="5" height="58" rx="3" fill="#79c0ff"/>
  <text x="172" y="570" text-anchor="middle" font-family="monospace" font-size="11" fill="#79c0ff" font-weight="700">06</text>
  <line x1="183" y1="552" x2="183" y2="594" stroke="#1a2840" stroke-width="1"/>
  <text x="270" y="568" text-anchor="middle" class="step-name">Resposta ao cliente</text>
  <text x="270" y="586" text-anchor="middle" class="step-sub">Encerrado se houver vencedor, ou aguarda nova jogada</text>
  <line x1="280" y1="602" x2="280" y2="622" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 7 — END -->
  <ellipse cx="280" cy="644" rx="56" ry="24" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="280" y="649" text-anchor="middle" class="oval-text">FIM</text>

  <!-- LEGEND -->
  <rect x="40" y="690" width="480" height="72" rx="6" fill="#0f1318" stroke="#21262d" stroke-width="1"/>

  <rect x="56" y="704" width="4" height="14" rx="2" fill="#388bfd"/>
  <text x="66" y="715" font-family="system-ui" font-size="10" fill="#8b949e">Etapa do sistema</text>

  <polygon points="66,726 76,731 66,736 56,731" fill="#1a1000" stroke="#f0883e" stroke-width="1.5"/>
  <text x="82" y="735" font-family="system-ui" font-size="10" fill="#8b949e">Decisão / Validação</text>

  <line x1="200" y1="710" x2="220" y2="710" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="226" y="714" font-family="system-ui" font-size="10" fill="#8b949e">Fluxo válido (Sim)</text>

  <line x1="200" y1="730" x2="220" y2="730" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="226" y="734" font-family="system-ui" font-size="10" fill="#8b949e">Retorno p/ nova jogada (Não)</text>

  <ellipse cx="380" cy="712" rx="28" ry="11" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
  <text x="380" y="716" text-anchor="middle" font-family="monospace" font-size="9" fill="#e6edf3">OVAL</text>
  <text x="414" y="716" font-family="system-ui" font-size="10" fill="#8b949e">Início / Fim</text>

  <text x="360" y="740" font-family="monospace" font-size="10" fill="#f0883e">04</text>
  <text x="376" y="740" font-family="system-ui" font-size="10" fill="#8b949e">  Número da etapa</text>
</svg>
