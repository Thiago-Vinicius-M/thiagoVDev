<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560">
  <defs>
    <style>
      .title      { font: 700 20px system-ui, sans-serif; fill: #58a6ff; }
      .subtitle   { font: 400 12px system-ui, sans-serif; fill: #6e7681; }
      .entity-name{ font: 700 13px system-ui, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .attr-pk    { font: 400 11px 'Courier New', monospace; fill: #f0883e; }
      .attr-fk    { font: 400 11px 'Courier New', monospace; fill: #79c0ff; }
      .attr       { font: 400 11px 'Courier New', monospace; fill: #8b949e; }
      .rel-label  { font: 400 10px system-ui, sans-serif; fill: #6e7681; font-style: italic; }
      .card       { font: 700 11px 'Courier New', monospace; fill: #f0883e; }
      .legend-title { font: 600 11px system-ui, sans-serif; fill: #6e7681; }
      .legend-text  { font: 400 10px system-ui, sans-serif; fill: #8b949e; }
      .legend-code  { font: 400 10px 'Courier New', monospace; }
    </style>
    <linearGradient id="hdr-blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="hdr-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#196127"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="hdr-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d1f6a"/>
      <stop offset="100%" stop-color="#6e40c9"/>
    </linearGradient>
    <linearGradient id="hdr-orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5c3300"/>
      <stop offset="100%" stop-color="#9a4500"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="920" height="560" fill="#0d1117"/>

  <!-- subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#21262d"/>
  </pattern>
  <rect width="920" height="560" fill="url(#dots)"/>

  <!-- ── Title ── -->
  <text x="460" y="36" text-anchor="middle" class="title">Modelo Entidade-Relacionamento</text>
  <text x="460" y="54" text-anchor="middle" class="subtitle">NewOrca — Sistema de Orçamentos</text>

  <!-- ════════════════════════════════════════ -->
  <!-- RELATIONSHIP LINES (drawn behind boxes) -->
  <!-- ════════════════════════════════════════ -->

  <!-- USUARIOS (right:235, cy:160) → ORCAMENTOS (left:345, y:215) -->
  <line x1="235" y1="160" x2="345" y2="218" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- cardinality badges -->
  <rect x="237" y="147" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="247" y="159" text-anchor="middle" class="card">1</text>
  <rect x="323" y="205" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="333" y="217" text-anchor="middle" class="card">N</text>
  <text x="284" y="180" text-anchor="middle" class="rel-label">cria</text>

  <!-- CLIENTES (right:235, cy:405) → ORCAMENTOS (left:345, y:355) -->
  <line x1="235" y1="405" x2="345" y2="355" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="237" y="392" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="247" y="404" text-anchor="middle" class="card">1</text>
  <rect x="323" y="342" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="333" y="354" text-anchor="middle" class="card">N</text>
  <text x="284" y="382" text-anchor="middle" class="rel-label">pertence a</text>

  <!-- ORCAMENTOS (right:565, y:218) → PRODUTOS (left:660, cy:160) -->
  <line x1="565" y1="218" x2="660" y2="160" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <rect x="545" y="205" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="555" y="217" text-anchor="middle" class="card">N</text>
  <rect x="638" y="147" width="20" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="648" y="159" text-anchor="middle" class="card">M</text>
  <text x="612" y="184" text-anchor="middle" class="rel-label">contém</text>
  <text x="612" y="196" text-anchor="middle" class="rel-label">(via itens)</text>

  <!-- ══════════════════════ -->
  <!-- ENTITY: USUARIOS       -->
  <!-- x=35  y=80  w=200 h=162 -->
  <!-- ══════════════════════ -->
  <rect x="35" y="80" width="200" height="162" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <!-- header -->
  <rect x="35" y="80" width="200" height="38" rx="8" fill="url(#hdr-blue)"/>
  <rect x="35" y="100" width="200" height="18" fill="#1f6feb"/>
  <text x="135" y="105" text-anchor="middle" class="entity-name">USUARIOS</text>
  <line x1="35" y1="118" x2="235" y2="118" stroke="#388bfd" stroke-width="0.5" opacity="0.4"/>
  <!-- attrs (row h=20) -->
  <text x="52" y="139" class="attr-pk">(PK) id</text>
  <text x="52" y="159" class="attr">     nome</text>
  <text x="52" y="179" class="attr">     email</text>
  <text x="52" y="199" class="attr">     role</text>
  <text x="52" y="219" class="attr">     company_id</text>

  <!-- ══════════════════════ -->
  <!-- ENTITY: CLIENTES       -->
  <!-- x=35  y=330 w=200 h=162 -->
  <!-- ══════════════════════ -->
  <rect x="35" y="330" width="200" height="162" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="35" y="330" width="200" height="38" rx="8" fill="url(#hdr-green)"/>
  <rect x="35" y="350" width="200" height="18" fill="#196127"/>
  <text x="135" y="355" text-anchor="middle" class="entity-name">CLIENTES</text>
  <line x1="35" y1="368" x2="235" y2="368" stroke="#3fb950" stroke-width="0.5" opacity="0.4"/>
  <text x="52" y="389" class="attr-pk">(PK) id</text>
  <text x="52" y="409" class="attr">     nome</text>
  <text x="52" y="429" class="attr">     documento</text>
  <text x="52" y="449" class="attr">     email</text>
  <text x="52" y="469" class="attr">     telefone / endereco</text>

  <!-- ══════════════════════════════ -->
  <!-- ENTITY: ORCAMENTOS (central)   -->
  <!-- x=345 y=140 w=220 h=250       -->
  <!-- ══════════════════════════════ -->
  <rect x="345" y="140" width="220" height="255" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <rect x="345" y="140" width="220" height="38" rx="8" fill="url(#hdr-purple)"/>
  <rect x="345" y="160" width="220" height="18" fill="#3d1f6a"/>
  <text x="455" y="165" text-anchor="middle" class="entity-name">ORCAMENTOS</text>
  <line x1="345" y1="178" x2="565" y2="178" stroke="#a371f7" stroke-width="0.5" opacity="0.4"/>
  <text x="362" y="198" class="attr-pk">(PK) id</text>
  <text x="362" y="216" class="attr">     numero</text>
  <text x="362" y="234" class="attr">     status</text>
  <text x="362" y="252" class="attr">     criado_em</text>
  <text x="362" y="270" class="attr">     validade_ate</text>
  <text x="362" y="288" class="attr">     subtotal</text>
  <text x="362" y="306" class="attr">     total</text>
  <text x="362" y="324" class="attr">     empresa (snapshot)</text>
  <text x="362" y="342" class="attr-fk">(FK) usuario_id</text>
  <text x="362" y="360" class="attr">     pagamento</text>
  <text x="362" y="378" class="attr">     observacoes</text>

  <!-- ══════════════════════ -->
  <!-- ENTITY: PRODUTOS       -->
  <!-- x=660 y=80  w=200 h=162 -->
  <!-- ══════════════════════ -->
  <rect x="660" y="80" width="200" height="162" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="1.5"/>
  <rect x="660" y="80" width="200" height="38" rx="8" fill="url(#hdr-orange)"/>
  <rect x="660" y="100" width="200" height="18" fill="#5c3300"/>
  <text x="760" y="105" text-anchor="middle" class="entity-name">PRODUTOS</text>
  <line x1="660" y1="118" x2="860" y2="118" stroke="#f0883e" stroke-width="0.5" opacity="0.4"/>
  <text x="678" y="139" class="attr-pk">(PK) id</text>
  <text x="678" y="159" class="attr">     codigo</text>
  <text x="678" y="179" class="attr">     nome</text>
  <text x="678" y="199" class="attr">     preco_unitario</text>
  <text x="678" y="219" class="attr">     descricao / ativo</text>

  <!-- ══════════════════════ -->
  <!-- LEGEND                 -->
  <!-- ══════════════════════ -->
  <rect x="345" y="415" width="220" height="116" rx="6" fill="#0f1318" stroke="#21262d" stroke-width="1"/>
  <text x="455" y="433" text-anchor="middle" class="legend-title">LEGENDA</text>

  <!-- line sample -->
  <line x1="360" y1="447" x2="400" y2="447" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="406" y="451" class="legend-text">  Relacionamento</text>

  <rect x="360" y="458" width="18" height="14" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="369" y="469" text-anchor="middle" class="card" font-size="10">N</text>
  <text x="384" y="469" class="legend-text">  Cardinalidade</text>

  <text x="360" y="489" class="legend-code" fill="#f0883e">(PK)</text>
  <text x="386" y="489" class="legend-text"> Chave Primária</text>

  <text x="360" y="505" class="legend-code" fill="#79c0ff">(FK)</text>
  <text x="386" y="505" class="legend-text"> Chave Estrangeira</text>

  <line x1="360" y1="517" x2="370" y2="517" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="378" y="521" class="legend-text"> 1:N  Um para Muitos</text>
  <line x1="360" y1="529" x2="370" y2="529" stroke="#30363d" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="378" y="533" class="legend-text"> N:M  Muitos para Muitos</text>
</svg>
